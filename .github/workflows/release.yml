name: Release to Play Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Check release branch
        env:
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          # Primary: when the tag is pushed together with the branch, base_ref
          # is the source branch. This is the fast, reliable path.
          case "$BASE_REF" in
            refs/heads/release/play-store*)
              echo "Release branch confirmed via base_ref ($BASE_REF)."; exit 0 ;;
          esac
          # Fallback: base_ref is empty when a tag is pushed on its own (or via
          # workflow_dispatch). Verify the tagged commit is contained in a
          # release/play-store branch instead, so the guard still holds.
          echo "base_ref empty/non-matching (base_ref='$BASE_REF'); verifying tag commit is on a release/play-store branch."
          git fetch -q origin '+refs/heads/release/play-store*:refs/remotes/origin/release/play-store*'
          for ref in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/play-store*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
              echo "Release branch confirmed: $GITHUB_SHA is contained in $ref."; exit 0
            fi
          done
          echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on any release/play-store branch; aborting."
          exit 1

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Write keystore and key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/multimax
          cat > android/key.properties <<EOF
          storeFile=../multimax
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.ddmco.multimax
          releaseFiles: build/app/outputs/bundle/release/*.aab
          tracks: alpha
          status: completed
          whatsNewDirectory: whatsnew
