org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 built-in Kotlin and new DSL (AGP's defaults; Flutter's migrator sets both
# to false). Built-in Kotlin means AGP compiles Kotlin itself, so neither the app
# nor any plugin applies the Kotlin Gradle plugin. It needs Flutter >= 3.47 and
# plugins that skip KGP when it is on (share_plus >= 13.3.1, package_info_plus
# >= 10.2.2). Keep both lines, written out as `true`: Flutter's migrator re-adds
# `=false` whenever a flag is missing, and flutter_timezone only skips KGP when it
# reads the literal value `true`.
android.builtInKotlin=true
android.newDsl=true
