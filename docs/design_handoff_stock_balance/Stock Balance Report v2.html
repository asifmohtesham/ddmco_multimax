<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Balance v2 — Multimax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="multimax-ds/ds.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  *{box-sizing:border-box;}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:34px 16px 60px;background:radial-gradient(120% 80% at 50% -10%, color-mix(in srgb,var(--primary) 7%,var(--bg)), var(--bg) 60%);}
  .stage-cap{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
  .stage-cap h1{font-size:15px;font-weight:600;margin:0;}
  .stage-cap p{font-size:12px;color:var(--text-subtle);margin:0;font-family:var(--mono);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--text-muted);max-width:392px;}
  .legend b{color:var(--text);font-weight:600;}

  .device{width:392px;}
  .device .screen{height:812px;position:relative;overflow:hidden;}
  .statusbar .sysico svg{display:block;}
  .statusbar .batt{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;}

  /* app bar */
  .appbar{border-bottom:1px solid var(--border);}
  .appbar .toolbar{height:54px;padding:0 6px;}
  .appbar .title-lg{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0 16px 10px;}
  .filt-btn{position:relative;width:44px;height:44px;border-radius:var(--r-full);border:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;}
  .filt-btn .ico{width:20px;height:20px;}
  .filt-btn .count-badge{position:absolute;top:-2px;right:-2px;}
  .fchips{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;}
  .fchips::-webkit-scrollbar{display:none;}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 11px;
    border-radius:var(--r-full);font-size:12px;font-weight:600;white-space:nowrap;
    background:color-mix(in srgb,var(--primary) 11%,var(--fg));color:var(--blue-700);
    border:1px solid color-mix(in srgb,var(--primary) 22%,var(--border));}
  .fchip > svg{width:13px;height:13px;opacity:.8;}
  .fchip .x{width:20px;height:20px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--primary) 18%,transparent);}
  .fchip .x svg{width:11px;height:11px;}

  /* summary strip */
  .sb-summary{display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--subtle);border-bottom:1px solid var(--border);}
  .sb-summary .counts{font-size:12px;color:var(--text-muted);}
  .sb-summary .counts b{font-size:13px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
  .sb-summary .counts .sep{color:var(--border-strong);margin:0 5px;}
  .sb-summary .spacer{flex:1;}
  .sw{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text-muted);
    cursor:pointer;border:none;background:none;padding:0;}
  .sw .track{width:32px;height:18px;border-radius:var(--r-full);background:var(--border-strong);position:relative;transition:background .15s;}
  .sw .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:var(--shadow-xs);transition:transform .15s;}
  .sw.on .track{background:var(--primary);}
  .sw.on .track::after{transform:translateX(14px);}
  .neg-alert{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;
    padding:4px 9px 4px 8px;border-radius:var(--r-full);
    background:color-mix(in srgb,var(--red-500) 12%,var(--fg));color:var(--red-700);
    border:1px solid color-mix(in srgb,var(--red-500) 24%,var(--border));}
  .neg-alert.on{background:var(--red-500);color:#fff;border-color:var(--red-500);}
  .neg-alert .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  /* quick-filter control bar */
  .ctrl{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:var(--fg);
    border-bottom:1px solid var(--border);}
  .ctrl .row{display:flex;gap:8px;}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:var(--r-md);
    background:var(--subtle);border:1px solid var(--border);}
  .search svg{width:16px;height:16px;color:var(--text-subtle);flex:none;}
  .search input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:13px;color:var(--text);}
  .sel{position:relative;display:inline-flex;align-items:center;}
  .sel select{appearance:none;height:38px;padding:0 30px 0 12px;border-radius:var(--r-md);
    background:var(--subtle);border:1px solid var(--border);font:inherit;font-size:12.5px;font-weight:600;
    color:var(--text);outline:none;cursor:pointer;max-width:150px;text-overflow:ellipsis;}
  .sel svg{position:absolute;right:9px;width:15px;height:15px;color:var(--text-subtle);pointer-events:none;}
  .seg{display:flex;gap:0;background:var(--subtle);border:1px solid var(--border);border-radius:var(--r-md);
    padding:3px;overflow:hidden;}
  .seg .seg{all:unset;flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted);
    padding:6px 4px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;}
  .seg .seg.on{background:var(--fg);color:var(--primary);box-shadow:var(--shadow-xs);}

  /* list */
  .sb-list{position:absolute;left:0;right:0;top:var(--list-top,0);bottom:0;overflow-y:auto;overflow-x:hidden;
    padding:12px 12px 28px;display:flex;flex-direction:column;gap:11px;background:var(--bg);}
  .sb-scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .sb-list::-webkit-scrollbar{width:0;}

  /* card */
  .sb-card{flex:none;background:var(--fg);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--shadow-xs);padding:13px 14px 12px;position:relative;overflow:hidden;cursor:pointer;
    transition:box-shadow .12s,transform .12s;}
  .sb-card:active{transform:scale(.992);}
  .sb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--gray-400));z-index:2;}
  .sb-card.ok    {--accent:var(--green-500);--tint:var(--green-500);--tfg:var(--green-700);}
  .sb-card.watch {--accent:var(--orange-500);--tint:var(--orange-500);--tfg:var(--orange-700);}
  .sb-card.neg   {--accent:var(--red-500);--tint:var(--red-500);--tfg:var(--red-700);}
  .sb-card.empty {--accent:var(--gray-400);--tint:var(--gray-500);--tfg:var(--gray-700);}
  /* full-card tap target sits beneath interactive children */
  .sb-open{position:absolute;inset:0;border:none;background:none;cursor:pointer;z-index:1;}
  .sb-card > :not(.sb-open){position:relative;z-index:2;}

  .sb-head{display:flex;align-items:flex-start;gap:11px;}
  .sb-thumb{flex:none;width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,color-mix(in srgb,var(--ti) 18%,var(--fg)),color-mix(in srgb,var(--ti) 6%,var(--fg)));
    border:1px solid color-mix(in srgb,var(--ti) 26%,var(--border));margin-top:1px;}
  .sb-thumb svg{width:26px;height:26px;fill:var(--ti);}
  .sb-thumb.fallback{background:var(--subtle);border:1px solid var(--border);}
  .sb-thumb.fallback span{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text-subtle);}
  .sb-id{min-width:0;flex:1;}
  .sb-code{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text-subtle);letter-spacing:.02em;}
  .sb-name{font-size:15.5px;font-weight:600;color:var(--text);line-height:1.25;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sb-balance{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;min-width:60px;
    padding:6px 11px;border-radius:var(--r-md);line-height:1;
    background:color-mix(in srgb,var(--tint) 13%,var(--fg));border:1px solid color-mix(in srgb,var(--tint) 26%,var(--border));}
  .sb-qty{font-size:23px;font-weight:700;color:var(--tfg);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .sb-uom{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    color:color-mix(in srgb,var(--tfg) 70%,var(--text-muted));margin-top:3px;}

  .sb-loc{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--text-muted);
    overflow:hidden;white-space:nowrap;}
  .sb-loc svg{width:14px;height:14px;flex:none;color:var(--text-subtle);}
  .sb-loc b{color:var(--text);font-weight:600;}
  .sb-loc .sep{color:var(--border-strong);}
  .sb-loc .wh{all:unset;cursor:pointer;display:inline-flex;align-items:center;border-radius:4px;}
  .sb-loc .wh b{border-bottom:1px dashed color-mix(in srgb,var(--primary) 50%,transparent);}
  .sb-loc .norack{color:var(--text-subtle);font-style:italic;}

  .sb-ledger{display:grid;grid-template-columns:repeat(4,1fr);margin-top:11px;
    background:var(--subtle);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .sb-ledger .cell{padding:8px 6px 9px;text-align:center;position:relative;}
  .sb-ledger .cell + .cell::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--border);}
  .sb-ledger .k{display:block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle);}
  .sb-ledger .v{display:block;margin-top:3px;font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .sb-ledger .cell.in .v{color:var(--green-600);}
  .sb-ledger .cell.out .v{color:var(--red-600);}
  .sb-ledger .cell.in .v.zero,.sb-ledger .cell.out .v.zero{color:var(--text-subtle);}
  .sb-ledger .cell.bal{background:color-mix(in srgb,var(--accent) 9%,var(--fg));}
  .sb-ledger .cell.bal .v{color:var(--tfg);}

  .sb-avail{margin-top:11px;}
  .sb-bar{height:7px;border-radius:var(--r-full);background:var(--border);overflow:hidden;display:flex;}
  .sb-bar i{height:100%;display:block;}
  .sb-bar .free{background:var(--green-500);}
  .sb-bar .resv{background:var(--orange-500);}
  .sb-avail .lab{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:11.5px;font-weight:500;}
  .sb-avail .lab .k{display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);}
  .sb-avail .lab .k::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);}
  .sb-avail .lab .k b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
  .sb-avail .lab .free{--c:var(--green-500);}
  .sb-avail .lab .resv{--c:var(--orange-500);}
  .sb-avail .lab button.resv{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);}
  .sb-avail .lab button.resv::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--orange-500);}
  .sb-avail .lab button.resv[disabled]{cursor:default;opacity:.7;}
  .sb-avail .lab .chev{width:13px;height:13px;fill:none;stroke:var(--orange-600);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

  .sb-note{display:flex;align-items:center;gap:8px;margin-top:11px;padding:8px 11px;border-radius:var(--r-md);font-size:12.5px;font-weight:600;}
  .sb-note svg{width:16px;height:16px;flex:none;}
  .sb-note.neg{background:color-mix(in srgb,var(--red-500) 11%,var(--fg));color:var(--red-700);border:1px solid color-mix(in srgb,var(--red-500) 24%,var(--border));}
  .sb-note.empty{background:var(--subtle);color:var(--text-muted);border:1px solid var(--border);}

  .sb-meta{display:flex;align-items:center;gap:14px;margin-top:11px;padding-top:10px;
    border-top:1px dashed var(--border);font-size:11.5px;color:var(--text-subtle);flex-wrap:wrap;}
  .sb-meta .m{display:inline-flex;align-items:baseline;gap:5px;}
  .sb-meta .m b{color:var(--text-muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .sb-meta .m.muted b{color:var(--text-subtle);}
  .sb-meta .cust{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-muted);
    padding:3px 6px 3px 8px;border-radius:var(--r-sm);background:var(--subtle);border:1px solid var(--border);}
  .sb-meta .cust svg{width:12px;height:12px;opacity:.7;}
  .sb-meta .cust .chev{width:12px;height:12px;fill:none;stroke:var(--text-subtle);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:1;}

  .empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--text-subtle);}
  .empty-state svg{width:46px;height:46px;fill:var(--border-strong);}
  .empty-state p{margin:0;font-size:13px;}
  .empty-state button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--primary);
    padding:7px 14px;border-radius:var(--r-full);background:color-mix(in srgb,var(--primary) 10%,var(--fg));}

  /* bottom sheet */
  #scrim{position:absolute;inset:0;background:rgba(15,23,32,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  #scrim.on{opacity:1;pointer-events:auto;}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--fg);z-index:21;
    border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(15,23,32,.22);
    transform:translateY(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;padding:8px 16px 18px;overflow:hidden;}
  #sheet.on{transform:translateY(0);}
  .sh-grip{width:38px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 10px;flex:none;}
  .sh-head{display:flex;align-items:flex-start;gap:12px;}
  .sh-eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);}
  .sh-title{font-size:18px;font-weight:700;color:var(--text);margin-top:2px;letter-spacing:-.01em;}
  .sh-sub{font-size:12.5px;color:var(--text-muted);margin-top:1px;}
  .sh-x{all:unset;cursor:pointer;margin-left:auto;width:30px;height:30px;border-radius:var(--r-full);
    display:flex;align-items:center;justify-content:center;background:var(--subtle);flex:none;}
  .sh-x svg{width:16px;height:16px;fill:var(--text-muted);}
  .sh-route{display:flex;align-items:center;gap:7px;margin-top:12px;padding:8px 10px;border-radius:var(--r-md);
    font-size:11.5px;font-weight:600;color:var(--text-muted);background:var(--subtle);border:1px solid var(--border);}
  .sh-route svg{width:14px;height:14px;fill:var(--text-subtle);flex:none;}
  .led-th{display:flex;align-items:center;margin-top:14px;padding:0 4px 6px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle);border-bottom:1px solid var(--border);}
  .led-th span:first-child{flex:1;}
  .led-th span:not(:first-child){width:74px;text-align:right;}
  .led-list{overflow-y:auto;margin-top:2px;}
  .led-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .led-l{flex:1;min-width:0;}
  .led-v{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .led-t{font-size:11px;color:var(--text-subtle);margin-top:1px;}
  .led-q{width:74px;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-subtle);}
  .led-q.pos{color:var(--green-600);} .led-q.neg{color:var(--red-600);}
  .led-b{width:74px;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);}
  .led-b.resv{color:var(--orange-700);}
  .sh-cta{all:unset;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;
    height:46px;border-radius:var(--r-md);background:var(--primary);color:#fff;font-size:13.5px;font-weight:600;flex:none;}
  .sh-cta svg{width:16px;height:16px;fill:currentColor;}
</style>
</head>
<body>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#2490ef"/>
    <rect x="26" y="30" width="30" height="30" rx="7" fill="#bfe0fb"/>
    <rect x="62" y="32" width="12" height="9" rx="2" fill="#fff"/>
    <rect x="26" y="66" width="48" height="8" rx="4" fill="#fff"/>
  </svg>
</template>

<div class="stage">
  <div class="stage-cap">
    <h1>Stock Balance — operational enhancements</h1>
    <p>hide empty · item images · quick filters · tap to drill down</p>
  </div>
  <div class="legend">
    <span>Tap a <b>card</b> → Stock Ledger</span>
    <span>Tap <b>Reserved</b> → reservations</span>
    <span>Tap <b>customer</b> → linked items</span>
    <span>Tap <b>warehouse</b> → filter</span>
  </div>

  <div class="device"><div class="screen">

    <div class="statusbar">
      <span class="clock">10:02</span>
      <span class="sysico">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4 2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
        <span class="batt">96
          <svg width="22" height="13" viewBox="0 0 24 13" fill="none"><rect x="1" y="1" width="19" height="11" rx="2.5" stroke="currentColor" stroke-width="1.4"/><rect x="2.6" y="2.6" width="13" height="7.8" rx="1.2" fill="currentColor"/><rect x="21" y="4" width="2" height="5" rx="1" fill="currentColor"/></svg>
        </span>
      </span>
    </div>

    <div class="sb-scroll">
      <div class="appbar">
        <div class="toolbar">
          <button class="icon-btn" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
          <span style="flex:1"></span>
          <button class="filt-btn" aria-label="Filters">
            <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
            <span class="count-badge">5</span>
          </button>
        </div>
        <div class="title-lg">Stock Balance</div>
        <div class="fchips">
          <span class="fchip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>From: 2026-06-21<span class="x"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span></span>
          <span class="fchip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>Warehouse: WH-DXB3<span class="x"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span></span>
        </div>
      </div>

      <!-- summary strip with hide-empty + images toggles -->
      <div class="sb-summary">
        <div class="counts" id="sb-counts"></div>
        <div class="spacer"></div>
        <button class="sw" id="sw-img" title="Show item images"><span class="track"></span>Images</button>
        <button class="sw" id="sw-empty" title="Hide out-of-stock"><span class="track"></span>Hide empty</button>
        <button class="neg-alert" id="sb-neg"><span class="dot"></span><b>1</b>&nbsp;negative</button>
      </div>

      <!-- quick-filter control bar (client-side, maps to report options) -->
      <div class="ctrl">
        <div class="row">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            <input id="f-q" type="text" placeholder="Search item code or name" autocomplete="off">
          </label>
          <span class="sel">
            <select id="f-wh" aria-label="Warehouse"></select>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
          </span>
          <span class="sel">
            <select id="f-sort" aria-label="Sort">
              <option value="bal">Balance ↑</option>
              <option value="val">Value ↓</option>
              <option value="move">Movement</option>
              <option value="code">Code</option>
            </select>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
          </span>
        </div>
        <div class="seg" id="seg">
          <button class="seg" data-state="ALL">All</button>
          <button class="seg" data-state="instock">In stock</button>
          <button class="seg" data-state="neg">Negative</button>
          <button class="seg" data-state="empty">Empty</button>
        </div>
      </div>

      <div style="position:relative;flex:1;min-height:0;">
        <div class="sb-list" id="sb-list" style="--list-top:0;position:absolute;"></div>
      </div>
    </div>

    <div id="scrim"></div>
    <div id="sheet"></div>
  </div></div>
</div>

<script src="stock_balance_app.js"></script>
</body>
</html>
