name: multimax
description: "Manage stock, order, packing and delivery."
publish_to: 'none'

version: 2.14.0+55

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.3.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider:
  get_storage:
  collection:
  uuid:
  intl: ^0.19.0
  percent_indicator:
  flutter_html:
  share_plus: ^12.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  qr_flutter:
  pdf:
  barcode_widget: ^2.0.4
  sqflite: ^2.4.2
  path: ^1.9.1
  package_info_plus: ^8.0.0
  sqflite_common_ffi:
  # Scales the collapsed toolbar title font down before wrapping so
  # the full DocType name always fits without ellipsis.
  auto_size_text: ^3.0.0
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.5.5
  socket_io_client: ^2.0.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  speech_to_text: ^7.4.0
  # Scheduled draft-document digest notifications (Android-only feature):
  # workmanager wakes the app in the background at the scheduled times,
  # flutter_local_notifications posts the OS notification.
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1
  # iOS scheduled digest reminders need an explicit timezone for zonedSchedule.
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/logo.jpg
    - lib/assets/fonts/

  fonts:
    - family: ShureTechMono
      fonts:
        - asset: lib/assets/fonts/ShureTechMonoNerdFontMono-Regular.ttf
          style: normal
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Inter-Bold.ttf
          weight: 700
